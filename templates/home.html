{%extends 'base.html'%}

{%block content%}
<div class="d-flex flex-wrap justidy-content-center">
{%for post in data%}
<div class="col-sm-3" >
  <div class="card-body">
    <h5 class="card-title">{{post.title}}</h5>
    <p class="card-text">{{post.content}}</p>
    <small>Author: {{post.author.name}}</small>
    <p>
    Catagories : {%for cat in post.catagory.all%}
    <button class="btn btn-primary btn-sm m-2">{{cat.name}}</button>
    {%endfor%}
    </p>
    <a href="{%url 'edit_post' post.id%}" class="btn btn-warning">Edit</a>
    <a href="{%url 'delete_post' post.id%}" class="btn btn-warning">Delete</a>
  </div>
</div>
{%endfor%}
</div>
{%endblock%}
